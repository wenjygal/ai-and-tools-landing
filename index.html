<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & Tools — הרשמה לרשימת התפוצה</title>
<meta name="description" content="הרשמו לקבלת התראות על הדרכות AI חדשות ועל הזמנות להדרכות שמחוץ לרשימה.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
<link rel="stylesheet" href="styles.css">
<script>
  window.REQUIRED_ERROR_MESSAGE = "השדה הזה לא יכול להישאר ריק.";
  window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = "הפרטים שהוזנו לא תקינים. בדקו את הפורמט ונסו שוב.";
  window.GENERIC_INVALID_MESSAGE = "הפרטים שהוזנו לא תקינים. בדקו את הפורמט ונסו שוב.";
  window.LOCALE = 'he';
  window.translation = { common: {} };
  var AUTOHIDE = Boolean(0);
</script>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="wrap">
  <div class="hero">

    <div class="form-panel">
      <div class="card">
        <span class="mark">AI &amp; TOOLS</span>
        <h1>הרשמו לקבלת התראות על הדרכות חדשות</h1>

        <div id="error-message" class="sib-form-message-panel sib-form-message-panel--error">
          <span>ההרשמה לא נקלטה. נסו שוב.</span>
        </div>
        <div id="success-message" class="sib-form-message-panel sib-form-message-panel--success">
          <span>נרשמת בהצלחה. ההדרכה הבאה בדרך למייל שלך.</span>
        </div>

        <form id="sib-form" method="POST" data-type="subscription"
              action="https://952b7ccc.sibforms.com/serve/MUIFADOPmKf06Wbxz5zybkbhmynp6BkCRywBzx2Fzv1_gPz4oQQBGsqjXvWK1Y4NfoC7QmMwr8x2A2_7fwTaKEc2XmCWvwmVmhnbmAOBqR2tkOSgfUm_B_NGre77dimlXZnWGmQ3rro8GAWvam0p1uMM_gtvx2ZT5ErsBDhedNLjWNWlc2btatmAhjQuBhGND3EeE9VM1ajgbayi">
          <div class="field">
            <label for="FIRSTNAME">שם מלא</label>
            <input type="text" id="FIRSTNAME" name="FIRSTNAME" placeholder="לדוגמה, גל כהן" autocomplete="name">
          </div>
          <div class="field">
            <label for="EMAIL" data-required="*">אימייל</label>
            <input class="input" type="email" id="EMAIL" name="EMAIL" placeholder="name@example.com" autocomplete="email" data-required="true" required>
            <label class="entry__error entry__error--primary"></label>
          </div>
          <label class="consent">
            <input type="checkbox" id="consent" required>
            <span>מאשר/ת קבלת עדכונים מ-AI &amp; Tools במייל, כולל הזמנות להדרכות שמחוץ לרשימה. אפשר להסיר הרשמה בכל עת.</span>
          </label>

          <input type="text" name="email_address_check" value="" class="input--hidden">
          <input type="hidden" name="locale" value="he">

          <button class="sib-form-block__button sib-form-block__button-with-loader" form="sib-form" type="submit" id="submitBtn">
            <svg class="icon clickable__icon progress-indicator__icon sib-hide-loader-icon" viewBox="0 0 512 512">
              <path d="M460.116 373.846l-20.823-12.022c-5.541-3.199-7.54-10.159-4.663-15.874 30.137-59.886 28.343-131.652-5.386-189.946-33.641-58.394-94.896-95.833-161.827-99.676C261.028 55.961 256 50.751 256 44.352V20.309c0-6.904 5.808-12.337 12.703-11.982 83.556 4.306 160.163 50.864 202.11 123.677 42.063 72.696 44.079 162.316 6.031 236.832-3.14 6.148-10.75 8.461-16.728 5.01z"/>
            </svg>
            הצטרפות לרשימה
          </button>
        </form>
      </div>
    </div>

    <div class="robot-panel">
      <div class="robot-tiltbox" id="robotTilt">
        <div class="robot-float">
          <div class="robot-rotor" id="robotRotor">
            <picture>
              <source srcset="assets/robot-coffee.webp" type="image/webp">
              <img class="robot-img" id="robotImg" src="assets/robot-coffee.png" width="932" height="1062" alt="הרובוט של AI &amp; Tools מחזיק כוס קפה עם הלוגו">
            </picture>
          </div>
        </div>
      </div>
      <div class="robot-ground" aria-hidden="true"></div>
      <p class="robot-caption">עוקב אחרי העכבר, ולוגם קפה כשעוברים לטופס</p>
    </div>

  </div>
</div>

<script src="script.js"></script>
<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
</body>
</html>
